<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Food Caching: find wild food near you</title>
  <meta name="description" content="Like geocaching, but for food. Find and share wild blackberries, apple trees, herbs and more growing near you.">
  <meta name="theme-color" content="#2f5d3a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🧺</span>
      <span class="brand-name">Food Caching</span>
    </div>
    <label class="season-toggle">
      <input type="checkbox" id="seasonOnly">
      <span>In season now</span>
    </label>
  </header>

  <nav class="chips" id="chips" aria-label="Filter by food"></nav>

  <main id="map" aria-label="Map of food caches"></main>

  <div class="map-buttons">
    <button class="round-btn" id="locateBtn" title="Go to my location" aria-label="Go to my location">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="add-btn" id="addBtn">
      <span aria-hidden="true">+</span> Add a cache
    </button>
  </div>

  <section class="sheet" id="sheet" aria-live="polite">
    <button class="sheet-handle" id="sheetHandle" aria-label="Expand or collapse list"></button>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
